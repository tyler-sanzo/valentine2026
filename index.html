<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Canvas for animated starfield background -->
    <canvas id="background"></canvas>

    <!-- STAGE 1: Photo Gallery with Click-through Progression -->
    <div id="stage-1" class="game-stage">
        <!-- Photo layers for parallax (5 random photos will be loaded by JS) -->
        <div class="photo-layer layer-1"></div>
        <div class="photo-layer layer-2"></div>
        <div class="photo-layer layer-3"></div>
        <div class="photo-layer layer-4"></div>
        <div class="photo-layer layer-5"></div>

        <!-- Text overlay container -->
        <div id="text-overlay">
            <p id="progressive-text"></p>
            <div id="tap-hint">Tap n-e-where ❤️</div>
        </div>
    </div>

    <!-- TRANSITION: Game Invitation Popup -->
    <div id="game-transition" class="game-popup" style="display: none;">
        <div class="popup-content">
            <h2>Redypajugar?</h2>
            <button id="start-game-btn" class="game-button">Let's Go! 💕</button>
        </div>
    </div>

    <!-- STAGE 2: Timeline Ordering Game -->
    <div id="stage-2" class="game-stage" style="display: none;">
        <div class="game-header">
            <h2>Put these moments in order...</h2>
            <p class="game-instruction">Drag the photos from earliest to latest (left to right)</p>
        </div>

        <!-- Drop zones for timeline ordering -->
        <div class="timeline-container">
            <div class="drop-zone" data-position="1">
                <span class="zone-label">First</span>
            </div>
            <div class="drop-zone" data-position="2">
                <span class="zone-label">Second</span>
            </div>
            <div class="drop-zone" data-position="3">
                <span class="zone-label">Third</span>
            </div>
        </div>

        <!-- Draggable photos for timeline (will be loaded by JS) -->
        <div class="photo-timeline timeline-photo-1" data-photo="13"></div>
        <div class="photo-timeline timeline-photo-2" data-photo="14"></div>
        <div class="photo-timeline timeline-photo-3" data-photo="16"></div>

        <button id="check-order-btn" class="game-button">Check My Answer</button>
    </div>

    <!-- STAGE 3: Jigsaw Puzzle Game -->
    <div id="stage-3" class="game-stage" style="display: none;">
        <div class="game-header">
            <h2>Put the pieces together...</h2>
            <p class="game-instruction">Drag the puzzle pieces to their correct spots</p>
        </div>

        <!-- Puzzle grid (drop zones) -->
        <div id="puzzle-grid">
            <!-- 12 drop zones will be generated by JS (3×4 grid) -->
        </div>

        <!-- Puzzle pieces container (draggable pieces) -->
        <div id="puzzle-pieces-container">
            <!-- 12 draggable pieces will be generated by JS -->
        </div>

        <button id="check-puzzle-btn" class="game-button">Check Puzzle</button>
    </div>

    <!-- STAGE 4: Victory - Swirling Photos with Spotify Link -->
    <div id="stage-4" class="game-stage" style="display: none;">
        <div class="swirl-container">
            <!-- Photos will be added here by JS and animated in a circle -->
        </div>

        <div class="victory-center">
            <h2 class="victory-text">You Did It! 🎉</h2>
            <a href="https://open.spotify.com/playlist/YOUR_PLAYLIST_ID"
               target="_blank"
               class="spotify-link game-button">
                Claim Your Prize 🎵
            </a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
